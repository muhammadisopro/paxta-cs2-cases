<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="ticket-grad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#818CF8"/>
      <stop offset="50%" stop-color="#6366F1"/>
      <stop offset="100%" stop-color="#4338CA"/>
    </linearGradient>
    <filter id="ticket-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <ellipse cx="120" cy="200" rx="80" ry="16" fill="#000000" opacity="0.4" filter="blur(6px)"/>
  <rect x="35" y="60" width="170" height="110" rx="18" fill="url(#ticket-grad)" stroke="#C7D2FE" stroke-width="2" filter="url(#ticket-glow)"/>
  <!-- Perforated Notches -->
  <circle cx="35" cy="115" r="14" fill="#070B18"/>
  <circle cx="205" cy="115" r="14" fill="#070B18"/>
  <!-- Dotted Divider -->
  <line x1="85" y1="65" x2="85" y2="165" stroke="#A5B4FC" stroke-width="2" stroke-dasharray="6 6"/>
  <!-- Star Icon & Text -->
  <polygon points="60,105 65,115 75,117 68,125 70,135 60,130 50,135 52,125 45,117 55,115" fill="#FDE047"/>
  <text x="145" y="112" fill="#FFFFFF" font-family="sans-serif" font-weight="900" font-size="20" text-anchor="middle">CASE PASS</text>
  <text x="145" y="132" fill="#E0E7FF" font-family="sans-serif" font-weight="700" font-size="12" text-anchor="middle">1X FREE OPEN</text>
</svg>
