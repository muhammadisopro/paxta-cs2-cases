<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <defs>
    <linearGradient id="star-grad" x1="0" y1="0" x2="240" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE047"/>
      <stop offset="50%" stop-color="#EAB308"/>
      <stop offset="100%" stop-color="#B45309"/>
    </linearGradient>
    <filter id="star-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <ellipse cx="120" cy="195" rx="80" ry="16" fill="#000000" opacity="0.45" filter="blur(6px)"/>
  <!-- Glowing Halo -->
  <circle cx="120" cy="115" r="70" fill="#EAB308" opacity="0.25" filter="url(#star-glow)"/>
  <!-- Central Big Star -->
  <polygon points="120,40 145,90 200,98 160,138 170,192 120,165 70,192 80,138 40,98 95,90" fill="url(#star-grad)" stroke="#FEF08A" stroke-width="3" filter="url(#star-glow)"/>
  <!-- Sparkles -->
  <circle cx="70" cy="65" r="4" fill="#FFFFFF"/>
  <circle cx="170" cy="60" r="5" fill="#FFFFFF"/>
  <circle cx="180" cy="160" r="3" fill="#FFFFFF"/>
</svg>
